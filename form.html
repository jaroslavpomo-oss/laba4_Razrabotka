        document.addEventListener("submit", function (event) {
            event.preventDefault();
            event.stopImmediatePropagation();
        }, true);

        document.addEventListener("click", function (event) {
            const target = event.target;

            if (!(target instanceof Element)) return;

            const button = target.closest(

            );

                event.preventDefault();
            }
        }, true);
    })();
    </script>

<main>
    <section class="form-hero">
        <div class="container">
            <h1>Запись на сервис</h1>
        </div>
    </section>

    <section class="form-section">
        <div class="container">
            <div class="form-wrapper">
                <div id="myForm">
                    <h4 class="mb-3">Форма записи</h4>

                    <div class="mb-3">
                        <label for="name" class="form-label">Ваше имя</label>
                        <input type="text" class="form-control"
                               id="name" name="name"
                               placeholder="Введите ваше имя">
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Телефон</label>
                        <input type="tel" class="form-control"
                               id="phone" name="phone"
                               placeholder="+7 (___) ___-__-__">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control"
                               id="email" name="email"
                               placeholder="Введите ваш e-mail">
                    </div>

                    <div class="mb-3">
                        <label for="brand" class="form-label">Марка автомобиля</label>
                        <input type="text" class="form-control"
                               id="brand" name="brand"
                               placeholder="Введите марку">
                    </div>

                    <div class="mb-3">
                        <label for="model" class="form-label">Модель автомобиля</label>
                        <input type="text" class="form-control"
                               id="model" name="model"
                               placeholder="Введите модель">
                    </div>

                    <div class="mb-3">
                        <label for="year" class="form-label">Год выпуска</label>
                        <input type="number" class="form-control"
                               id="year" name="year"
                               placeholder="Введите год">
                    </div>

                    <div class="mb-3">
                        <label for="service" class="form-label">Услуга</label>
                        <select class="form-select" id="service" name="service">
                            <option value="" selected disabled>Выберите услугу</option>
                            <option value="diagnostics">Диагностика</option>
                            <option value="engine">Ремонт двигателя</option>
                            <option value="brakes">Тормозная система</option>
                            <option value="maintenance">Техническое обслуживание</option>
                            <option value="other">Другое</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="datetime" class="form-label">Дата и время</label>
                        <input type="datetime-local" class="form-control"
                               id="datetime" name="datetime">
                    </div>

                    <div class="text-center">
                        <button type="button"
                                class="btn btn-warning"
                                id="submitBtn">
                            Отправить заявку
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
